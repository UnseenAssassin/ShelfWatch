<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelfWatch | Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
	<nav>
            <div class="logo">ShelfWatch</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="inventory.html" class="active">Inventory</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="login.html" class="login-btn">Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Your Pantry Inventory</h1>
        <p>Below is your current list of items.</p>
    </section>

    <section class="inventory-container">
        <div id="items"></div>
    </section>

<div id="items-container" style="display:flex; flex-wrap:wrap; gap:20px;"></div>


<script src="config.js"></script>

    <script>
	// When connected to API Gateway, update URL here

        async function loadItems() {
			const API_URL = CONFIG.API_URL;
            const S3_BUCKET = CONFIG.S3_BUCKET;
            const res = await fetch(API_URL);
            const items = await res.json();

            const container = document.getElementById("items");
            container.innerHTML = "";

            items.forEach(item => {
				onst imageUrl = `https://${S3_BUCKET}.s3.amazonaws.com/${item.imageKey}`;
                const div = document.createElement("div");
                div.className = "item-card";
                div.innerHTML = `
                    <h3>${item.name}</h3>
                    <p><strong>Quantity:</strong> ${item.quantity}</p>
                    <p><strong>Location:</strong> ${item.location}</p>
                    <p><strong>Expires:</strong> ${item.expirationDate}</p>
					<img src="${imageUrl}" alt="${item.name}" class="item-image"/>
                `;
                container.appendChild(div);
            });
        }

	loadItems();
    </script>

</body>
</html>
